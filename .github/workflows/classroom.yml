name: Autograding Tests

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Header comments (author and date)
        id: header-comments
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Header comments (author and date)
          setup-command: ""
          command: python -m pytest test_vars_make.py::test_header_comments -q
          timeout: 5
          max-score: 1

      - name: Circle calculation
        id: circle-calculation
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Circle calculation
          setup-command: ""
          command: python -m pytest test_vars_make.py::test_circle_calculation -q
          timeout: 5
          max-score: 3

      - name: Rectangle calculation
        id: rectangle-calculation
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Rectangle calculation
          setup-command: ""
          command: python -m pytest test_vars_make.py::test_rectangle_calculation -q
          timeout: 5
          max-score: 3

      - name: Octagon calculation
        id: octagon-calculation
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Octagon calculation
          setup-command: ""
          command: python -m pytest test_vars_make.py::test_octagon_calculation -q
          timeout: 5
          max-score: 3

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          HEADER-COMMENTS_RESULTS: "${{steps.header-comments.outputs.result}}"
          CIRCLE-CALCULATION_RESULTS: "${{steps.circle-calculation.outputs.result}}"
          RECTANGLE-CALCULATION_RESULTS: "${{steps.rectangle-calculation.outputs.result}}"
          OCTAGON-CALCULATION_RESULTS: "${{steps.octagon-calculation.outputs.result}}"
        with:
          runners: header-comments,circle-calculation,rectangle-calculation,octagon-calculation
